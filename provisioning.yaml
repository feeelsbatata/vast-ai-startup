# Vast.ai provisioning manifest: ComfyUI + MiniMax H3 (fl2va + ref2va, video+audio) + Mystic XXX LoRAs
#                                 + Krea 2 Turbo (text-to-image, img2img, up to 3 reference images, Identity Edit) + Realistic Snapshot LoRA
#
# Target image: vastai/comfyui (PyTorch cu130 build; any Blackwell-capable tag works).
# Set on the Vast template / instance:
#   -e PROVISIONING_MANIFEST=https://<raw url of this file>
#   -e CIVITAI_TOKEN=<your CivitAI API key>      (needed for the Mystic XXX + Realistic Snapshot LoRAs; skipped if unset)
# Disk: ~98 GB of model files on top of the image -> create the instance with >= 120 GB.
#
# Optional env overrides:
#   COMFYUI_VERSION   git tag/branch/commit for ComfyUI (default v0.35.0)
#   WORKSPACE         defaults to /workspace
#
# Re-run by hand on a live box:  provisioner /provisioning.yaml   (add --force to redo every phase)
# Log: /var/log/portal/provisioning.log   Flags: /.provisioning (running) /.provisioning_complete /.provisioning_failed

version: 1

settings:
  venv: "/venv/main"
  concurrency:
    hf_downloads: 4
  retry:
    max_attempts: 8
    initial_delay: 5
    backoff_multiplier: 2

on_failure:
  action: continue
  max_retries: 3
  retry_delay: 60

downloads:
  # ---- MiniMax H3 (Comfy-Org/MiniMax-H3) ----
  - url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors
    dest: "${WORKSPACE:-/workspace}/ComfyUI/models/diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors"
  - url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/text_encoders/qwen3vl_32b_minimax_h3_int8_convrot.safetensors
    dest: "${WORKSPACE:-/workspace}/ComfyUI/models/text_encoders/qwen3vl_32b_minimax_h3_int8_convrot.safetensors"
  - url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_video_vae_fp16.safetensors
    dest: "${WORKSPACE:-/workspace}/ComfyUI/models/vae/minimax_h3_video_vae_fp16.safetensors"
  - url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_audio_vae_fp32.safetensors
    dest: "${WORKSPACE:-/workspace}/ComfyUI/models/vae/minimax_h3_audio_vae_fp32.safetensors"
  - url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/loras/minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors
    dest: "${WORKSPACE:-/workspace}/ComfyUI/models/loras/minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors"
  # ref2va task (multiple reference images/videos/audio): separate DiT + its own turbo LoRA
  - url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/diffusion_models/minimax_h3_ref2va_pruned_int8_convrot.safetensors
    dest: "${WORKSPACE:-/workspace}/ComfyUI/models/diffusion_models/minimax_h3_ref2va_pruned_int8_convrot.safetensors"
  - url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/loras/minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.safetensors
    dest: "${WORKSPACE:-/workspace}/ComfyUI/models/loras/minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.safetensors"

  # ---- Krea 2 Turbo text-to-image (Comfy-Org/Krea-2), same files as the official image_krea2_turbo_t2i_int8 template ----
  - url: https://huggingface.co/Comfy-Org/Krea-2/resolve/main/diffusion_models/krea2_turbo_int8_convrot.safetensors
    dest: "${WORKSPACE:-/workspace}/ComfyUI/models/diffusion_models/krea2_turbo_int8_convrot.safetensors"
  - url: https://huggingface.co/Comfy-Org/Krea-2/resolve/main/text_encoders/qwen3vl_4b_fp8_scaled.safetensors
    dest: "${WORKSPACE:-/workspace}/ComfyUI/models/text_encoders/qwen3vl_4b_fp8_scaled.safetensors"
  - url: https://huggingface.co/Comfy-Org/Krea-2/resolve/main/vae/qwen_image_vae.safetensors
    dest: "${WORKSPACE:-/workspace}/ComfyUI/models/vae/qwen_image_vae.safetensors"
  # style-reference LoRA (ostris): lets Krea 2 Turbo take up to 3 reference images as latents
  - url: https://huggingface.co/Comfy-Org/Krea-2/resolve/main/loras/krea2_style_reference.safetensors
    dest: "${WORKSPACE:-/workspace}/ComfyUI/models/loras/krea2_style_reference.safetensors"
  # Identity Edit LoRA v1.2 (conradlocke): identity-preserving edits / restaging; needs the comfyui-krea2edit custom nodes (post-command 3)
  - url: https://huggingface.co/conradlocke/krea2-identity-edit/resolve/main/krea2_identity_edit_v1_2.safetensors
    dest: "${WORKSPACE:-/workspace}/ComfyUI/models/loras/krea2_identity_edit_v1_2.safetensors"

  # ---- GUI workflows with the CivitAI LoRAs wired in (kept next to this manifest in the repo) ----
  - url: https://raw.githubusercontent.com/feeelsbatata/vast-ai-startup/refs/heads/main/workflows/MiniMax_H3_i2v_fl2va_Mystic.json
    dest: "${WORKSPACE:-/workspace}/ComfyUI/user/default/workflows/MiniMax_H3_i2v_fl2va_Mystic.json"
  - url: https://raw.githubusercontent.com/feeelsbatata/vast-ai-startup/refs/heads/main/workflows/MiniMax_H3_ref2va_Mystic.json
    dest: "${WORKSPACE:-/workspace}/ComfyUI/user/default/workflows/MiniMax_H3_ref2va_Mystic.json"
  - url: https://raw.githubusercontent.com/feeelsbatata/vast-ai-startup/refs/heads/main/workflows/Krea2_turbo_t2i_RealisticSnapshot.json
    dest: "${WORKSPACE:-/workspace}/ComfyUI/user/default/workflows/Krea2_turbo_t2i_RealisticSnapshot.json"
  - url: https://raw.githubusercontent.com/feeelsbatata/vast-ai-startup/refs/heads/main/workflows/Krea2_turbo_img2img_RealisticSnapshot.json
    dest: "${WORKSPACE:-/workspace}/ComfyUI/user/default/workflows/Krea2_turbo_img2img_RealisticSnapshot.json"
  - url: https://raw.githubusercontent.com/feeelsbatata/vast-ai-startup/refs/heads/main/workflows/Krea2_turbo_multiref_RealisticSnapshot.json
    dest: "${WORKSPACE:-/workspace}/ComfyUI/user/default/workflows/Krea2_turbo_multiref_RealisticSnapshot.json"
  - url: https://raw.githubusercontent.com/feeelsbatata/vast-ai-startup/refs/heads/main/workflows/Krea2_identity_edit_RealisticSnapshot.json
    dest: "${WORKSPACE:-/workspace}/ComfyUI/user/default/workflows/Krea2_identity_edit_RealisticSnapshot.json"
  - url: https://raw.githubusercontent.com/feeelsbatata/vast-ai-startup/refs/heads/main/workflows/Krea2_store_restage_RealisticSnapshot.json
    dest: "${WORKSPACE:-/workspace}/ComfyUI/user/default/workflows/Krea2_store_restage_RealisticSnapshot.json"

# API-format graph for scripting (POST to /prompt). NOT a GUI workflow, so it lives outside the sidebar dir.
write_files_late:
  - path: "${WORKSPACE:-/workspace}/api_graphs/MiniMax_H3_test_api_graph.json"
    permissions: "0644"
    content: |
      {
       "1": {"class_type": "UNETLoader", "inputs": {"unet_name": "minimax_h3_fl2va_pruned_int8_convrot.safetensors", "weight_dtype": "default"}},
       "2": {"class_type": "CLIPLoader", "inputs": {"clip_name": "qwen3vl_32b_minimax_h3_int8_convrot.safetensors", "type": "minimax", "device": "default"}},
       "3": {"class_type": "VAELoader", "inputs": {"vae_name": "minimax_h3_video_vae_fp16.safetensors"}},
       "4": {"class_type": "VAELoader", "inputs": {"vae_name": "minimax_h3_audio_vae_fp32.safetensors"}},
       "5": {"class_type": "LoadImage", "inputs": {"image": "example.png", "upload": "image"}},
       "6": {"class_type": "MiniMaxH3ImageToVideo", "inputs": {"clip": ["2", 0], "vae": ["3", 0], "first_frame": ["5", 0], "prompt": "Cinematic slow push-in on the subject from image 1, soft studio lighting, subtle camera drift, gentle motion, realistic detail. Audio: quiet ambient room tone with a soft warm synth pad swelling gently.", "width": 1344, "height": 768, "length": 107}},
       "7": {"class_type": "RandomNoise", "inputs": {"noise_seed": 42}},
       "8": {"class_type": "KSamplerSelect", "inputs": {"sampler_name": "res_multistep"}},
       "9": {"class_type": "BasicScheduler", "inputs": {"model": ["16", 0], "scheduler": "simple", "steps": 20, "denoise": 1.0}},
       "10": {"class_type": "BasicGuider", "inputs": {"model": ["16", 0], "conditioning": ["6", 0]}},
       "11": {"class_type": "SamplerCustomAdvanced", "inputs": {"noise": ["7", 0], "guider": ["10", 0], "sampler": ["8", 0], "sigmas": ["9", 0], "latent_image": ["6", 1]}},
       "12": {"class_type": "VAEDecode", "inputs": {"samples": ["11", 0], "vae": ["3", 0]}},
       "13": {"class_type": "VAEDecodeAudio", "inputs": {"samples": ["11", 0], "vae": ["4", 0]}},
       "14": {"class_type": "CreateVideo", "inputs": {"images": ["12", 0], "fps": 24.0, "audio": ["13", 0]}},
       "15": {"class_type": "SaveVideo", "inputs": {"video": ["14", 0], "filename_prefix": "video/MiniMax_H3_Mystic", "format": "auto", "codec": "auto"}},
       "16": {"class_type": "LoraLoaderModelOnly", "inputs": {"model": ["1", 0], "lora_name": "MysticXXX_MMH3-V4.safetensors", "strength_model": 1.0}}
      }

post_commands:
  # 1. Pin ComfyUI to a release with MiniMax H3 support and sync its python deps into /venv/main.
  - |
    set -e
    cd "${WORKSPACE:-/workspace}/ComfyUI"
    git config --global --add safe.directory "$PWD" || true
    git fetch --tags -q origin
    git checkout -q "${COMFYUI_VERSION:-v0.35.0}"
    uv pip install --no-cache --python /venv/main/bin/python -r requirements.txt
    echo "ComfyUI at $(git describe --tags --always)"

  # 2. CivitAI LoRAs: [MMH3] Mystic XXX v4.0, FL2VA + REF2VA variants (https://civitai.com/models/1501507?modelVersionId=3266628)
  #    and Realistic Snapshot Krea 2 v0.5 (https://civitai.com/models/2268008?modelVersionId=3084537).
  #    Done here instead of `downloads`/`conditional_downloads` because (a) the provisioner's CivitAI token
  #    validation uses Python's default User-Agent, which Cloudflare blocks with 403, so `civitai_token_valid`
  #    is never true on this image, and (b) its civitai.com handler sends the token as an Authorization header
  #    that wget forwards to the R2 redirect, which also 403s. Token in the query string works.
  - |
    set -e
    D="${WORKSPACE:-/workspace}/ComfyUI/models/loras"; mkdir -p "$D"
    if [ -z "${CIVITAI_TOKEN:-}" ]; then echo "CIVITAI_TOKEN not set; skipping CivitAI LoRAs"; exit 0; fi
    # spec = "<modelVersionId> <fileId> <filename>"
    for spec in "3266628 3150341 MysticXXX_MMH3-V4.safetensors" \
                "3266628 3156453 MysticXXX_MMH3-V4-ref2va.safetensors" \
                "3084537 2963911 RealisticSnapshotKrea2.safetensors"; do
      set -- $spec; VER_ID=$1; FILE_ID=$2; L="$D/$3"
      if [ -s "$L" ]; then echo "already present: $L"; continue; fi
      wget -q --max-redirect=10 -O "$L.part" \
        "https://civitai.com/api/download/models/${VER_ID}?fileId=${FILE_ID}&token=${CIVITAI_TOKEN}" \
        || { rm -f "$L.part"; echo "CivitAI LoRA download failed: $3"; exit 1; }
      mv "$L.part" "$L"; ls -l "$L"
    done

  # 3. Custom nodes: comfyui-krea2edit (Krea2EditModelPatch + Krea2EditGroundedEncode, no extra python deps).
  #    ComfyUI is started by the image after provisioning, so the nodes are picked up on first boot.
  - |
    set -e
    N="${WORKSPACE:-/workspace}/ComfyUI/custom_nodes/comfyui-krea2edit"
    if [ -d "$N/.git" ]; then git -C "$N" pull -q --ff-only || true; else git clone -q https://github.com/lbouaraba/comfyui-krea2edit "$N"; fi
    echo "comfyui-krea2edit at $(git -C "$N" rev-parse --short HEAD)"

  # 4. Copy the official H3 GUI templates into the user's workflow list, pointed at the int8 text encoder.
  #    (The Mystic i2v / ref2va and Krea 2 Realistic Snapshot t2i / img2img / multiref workflows are downloaded ready-made in the downloads section above.)
  - |
    set -e
    /venv/main/bin/python - <<'PY'
    import json, os
    import comfyui_workflow_templates_json as pkg
    src = os.path.join(os.path.dirname(pkg.__file__), "templates")
    dst = os.path.join(os.environ.get("WORKSPACE", "/workspace"), "ComfyUI", "user", "default", "workflows")
    os.makedirs(dst, exist_ok=True)
    jobs = {
        "video_minimax_h3_i2v.json": ("MiniMax_H3_i2v_fl2va.json", {
            "qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors": "qwen3vl_32b_minimax_h3_int8_convrot.safetensors"}),
        "video_minimax_h3_t2v.json": ("MiniMax_H3_t2v.json", {
            "qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors": "qwen3vl_32b_minimax_h3_int8_convrot.safetensors"}),
        "video_minimax_h3_r2v.json": ("MiniMax_H3_ref2va.json", {
            "qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors": "qwen3vl_32b_minimax_h3_int8_convrot.safetensors"}),
        "video_minimax_h3_multiframe_reference.json": ("MiniMax_H3_ref2va_multiframe.json", {
            "qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors": "qwen3vl_32b_minimax_h3_int8_convrot.safetensors"}),
    }
    for name, (out, subs) in jobs.items():
        p = os.path.join(src, name)
        if not os.path.exists(p):
            print("template missing, skipped:", name); continue
        s = open(p).read()
        for a, b in subs.items(): s = s.replace(a, b)
        json.loads(s)
        open(os.path.join(dst, out), "w").write(s)
        print("workflow:", out)
    PY

  # 5. Sanity check: every model/workflow file present and non-trivial in size.
  - |
    set -e
    W="${WORKSPACE:-/workspace}"
    M="$W/ComfyUI/models"
    for f in diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors \
             text_encoders/qwen3vl_32b_minimax_h3_int8_convrot.safetensors \
             vae/minimax_h3_video_vae_fp16.safetensors vae/minimax_h3_audio_vae_fp32.safetensors \
             loras/minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors \
             diffusion_models/minimax_h3_ref2va_pruned_int8_convrot.safetensors \
             loras/minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.safetensors \
             diffusion_models/krea2_turbo_int8_convrot.safetensors \
             text_encoders/qwen3vl_4b_fp8_scaled.safetensors vae/qwen_image_vae.safetensors \
             loras/krea2_style_reference.safetensors loras/krea2_identity_edit_v1_2.safetensors; do
      [ -s "$M/$f" ] || { echo "MISSING: $M/$f"; exit 1; }
      ls -l "$M/$f"
    done
    if [ -n "${CIVITAI_TOKEN:-}" ]; then
      for f in MysticXXX_MMH3-V4.safetensors MysticXXX_MMH3-V4-ref2va.safetensors RealisticSnapshotKrea2.safetensors; do
        [ -s "$M/loras/$f" ] || { echo "MISSING: $M/loras/$f (CivitAI download failed?)"; exit 1; }
        ls -l "$M/loras/$f"
      done
    else
      echo "WARNING: CIVITAI_TOKEN not set; the Mystic XXX and Realistic Snapshot LoRAs were not downloaded. Their workflows will fail until they are added to $M/loras/."
    fi
    for WF in MiniMax_H3_i2v_fl2va_Mystic.json MiniMax_H3_ref2va_Mystic.json Krea2_turbo_t2i_RealisticSnapshot.json Krea2_turbo_img2img_RealisticSnapshot.json Krea2_turbo_multiref_RealisticSnapshot.json Krea2_identity_edit_RealisticSnapshot.json Krea2_store_restage_RealisticSnapshot.json; do
      P="$W/ComfyUI/user/default/workflows/$WF"
      [ -s "$P" ] && /venv/main/bin/python -c "import json,sys; json.load(open(sys.argv[1]))" "$P" || { echo "MISSING or invalid: $P"; exit 1; }
    done
    [ -f "$W/ComfyUI/custom_nodes/comfyui-krea2edit/__init__.py" ] || { echo "MISSING: comfyui-krea2edit custom nodes"; exit 1; }
    rm -rf "$M"/*/.cache
